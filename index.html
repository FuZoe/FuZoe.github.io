<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赞助与支持</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            background: #f4f5f7;
            color: #222;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .card {
            width: min(100%, 360px);
            padding: 28px;
            border: 1px solid #e8ebef;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 8px 28px rgba(20, 32, 44, 0.08);
            text-align: center;
        }

        .qr-placeholder {
            display: grid;
            place-items: center;
            width: 220px;
            height: 220px;
            margin: 0 auto 20px;
            border: 1px dashed #b8c1cc;
            border-radius: 8px;
            background:
                linear-gradient(90deg, rgba(17, 24, 39, 0.08) 1px, transparent 1px),
                linear-gradient(rgba(17, 24, 39, 0.08) 1px, transparent 1px),
                #fafbfc;
            background-size: 22px 22px;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
        }

        h1 {
            margin: 0 0 8px;
            color: #333;
            font-size: 22px;
            font-weight: 700;
        }

        p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="qr-placeholder" aria-label="赞助二维码占位">
            二维码图片待更新
        </div>
        <h1>感谢支持</h1>
        <p>买杯咖啡，支持创作 ☕️</p>
    </main>
</body>
</html>
